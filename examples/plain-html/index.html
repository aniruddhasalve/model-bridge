<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ModelBridge demo</title><style>body{font:16px system-ui;max-width:720px;margin:3rem auto;padding:0 1rem;color:#202321}textarea{width:100%;min-height:120px;margin:.5rem 0 1rem;padding:.7rem}button{padding:.7rem 1rem;background:#202321;color:#fff;border:0;border-radius:6px;cursor:pointer}pre{white-space:pre-wrap;background:#f2f0eb;padding:1rem;border-radius:8px}</style></head>
<body><h1>ModelBridge demo</h1><p>This demo calls a ModelBridge API in mock mode. Never expose a provider secret in browser code.</p><label for="text">Text to summarize</label><textarea id="text">ModelBridge lets projects use one API contract while the server chooses a model provider. This local demo uses a deterministic provider.</textarea><button id="run">Summarize</button><pre id="output" aria-live="polite"></pre><script type="module">import {ModelBridge} from '../../frontend/model-bridge.js';const client=new ModelBridge({baseUrl:'http://127.0.0.1:8000',apiKey:'local-development-key'});document.querySelector('#run').onclick=async()=>{try{document.querySelector('#output').textContent=JSON.stringify(await client.summarize(document.querySelector('#text').value),null,2)}catch(error){document.querySelector('#output').textContent=error.message}};</script></body></html>
